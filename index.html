// h — целевая высота в пикселях, bottom — нижняя точка (якорь по земле)
function spr(name, frame, cx, bottom, h, flip) {
  if (!atlasReady) return;
  const list = RECTS[name];
  const r = Array.isArray(list) ? list[((frame % list.length) + list.length) % list.length] : list;
  const sc = h / r.h, w = r.w * sc;
  ctx.save();
  ctx.translate(cx, bottom);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(atlas, r.x, r.y, r.w, r.h, -w / 2, -h, w, h);
  ctx.restore();
}

// ---------- путь ----------
const PATH = [
  {x:-40, y:250}, {x:210, y:250}, {x:210, y:120},
  {x:520, y:120}, {x:520, y:380}, {x:900, y:380}
];
const SEG = [];
let TOTAL = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const a = PATH[i], b = PATH[i+1];
  const len = Math.hypot(b.x-a.x, b.y-a.y);
  SEG.push({a, b, len, start: TOTAL});
  TOTAL += len;
}
function posAt(d) {
  d = Math.max(0, Math.min(d, TOTAL));
  for (const s of SEG) {
    if (d <= s.start + s.len) {
      const t = s.len ? (d - s.start) / s.len : 0;
      return {x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t};
    }
  }
  const e = PATH[PATH.length - 1];
  return {x: e.x, y: e.y};
}

// ---------- состояние ----------
const SLOTS = [
  {x:110, y:175}, {x:150, y:322}, {x:288, y:192}, {x:390, y:45},
  {x:600, y:308}, {x:700, y:452}
];
const state = {
  running: false, over: false, won: false,
  gold: 150, lives: 20, wave: 0, waveActive: false,
  enemies: [], towers: [], shots: [],
  spawnQueue: [], spawnTimer: 0, betweenTimer: 0,
  time: 0
};
const TOWER_COST = 50, UPGRADE_COST = 70;
const WAVES = [
  {count: 6,  hp: 40,  speed: 40, reward: 55,  unit: "pawn"},
  {count: 8,  hp: 70,  speed: 44, reward: 65,  unit: "pawn"},
  {count: 10, hp: 110, speed: 48, reward: 75,  unit: "arch"},
  {count: 12, hp: 160, speed: 52, reward: 90,  unit: "warr"},
  {count: 14, hp: 230, speed: 56, reward: 110, unit: "lanc"}
];
// здание башни зависит от уровня: башня → стрелковый дом → казарма
const TOWER_SPR = ["t1", "t2", "t3"];

// ---------- спавн ----------
function startWave() {
  if (state.waveActive || state.over || state.wave >= WAVES.length) return;
  const w = WAVES[state.wave];
  state.wave++;
  state.waveActive = true;
  state.spawnQueue = [];
  for (let i = 0; i < w.count; i++) state.spawnQueue.push({ ...w, delay: i * 0.65 });
  state.spawnTimer = 0;
}
function spawnEnemy(cfg) {
  state.enemies.push({
    d: 0, hp: cfg.hp, maxHp: cfg.hp, unit: cfg.unit,
    speed: cfg.speed * (0.9 + Math.random() * 0.2),
    anim: Math.random() * 2, dead: false
  });
}

// ---------- башни ----------
function towerAt(x, y) {
  let best = null, bestD = 26;
  for (const t of state.towers) {
    const d = Math.hypot(t.x - x, t.y - y);
    if (d < bestD) { bestD = d; best = t; }
  }
  return best;
}
function slotAt(x, y) {
  for (const s of SLOTS) {
    if (Math.hypot(s.x - x, s.y - y) < 26 && !state.towers.some(t => t.sx === s.x && t.sy === s.y))
      return s;
  }
  return null;
}
cv.addEventListener("click", (e) => {
  if (!state.running || state.over) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  const t = towerAt(x, y);
  if (t) {
    if (state.gold >= UPGRADE_COST && t.level < 3) {
      state.gold -= UPGRADE_COST;
      t.level++;
      t.range += 16; t.dmg += 12; t.fireRate = Math.max(0.22, t.fireRate * 0.85);
    }
    return;
  }
  const s = slotAt(x, y);
  if (s && state.gold >= TOWER_COST) {
    state.gold -= TOWER_COST;
    state.towers.push({
      sx: s.x, sy: s.y, x: s.x, y: s.y,
      range: 118, dmg: 22, fireRate: 0.62, timer: 0, level: 1, angle: 0
    });
  }
});
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); startWave(); }
});

// ---------- обновление ----------
function update(dt) {
  if (!state.running || state.over) return;
  state.time += dt;

  if (state.waveActive && state.spawnQueue.length) {
    state.spawnTimer += dt;
    while (state.spawnQueue.length && state.spawnTimer >= state.spawnQueue[0].delay) {
      spawnEnemy(state.spawnQueue.shift());
    }
  }

  for (const e of state.enemies) {
    if (e.dead) continue;
    e.d += e.speed * dt;
    e.anim += dt;
    if (e.d >= TOTAL) { e.dead = true; state.lives--; }
  }

  for (const t of state.towers) {
    t.timer -= dt;
    if (t.timer > 0) continue;
    let target = null;
    for (const e of state.enemies) {
      if (e.dead) continue;
      const p = posAt(e.d);
      if (Math.hypot(p.x - t.x, p.y - t.y) > t.range) continue;
      if (!target || e.d > target.d) target = e;
    }
    if (target) {
      t.timer = t.fireRate;
      const p = posAt(target.d);
      t.angle = Math.atan2(p.y - t.y, p.x - t.x);
      target.hp -= t.dmg;
      state.shots.push({x1: t.x, y1: t.y - 30, x2: p.x, y2: p.y - 20,
                        a: t.angle, life: 0.14});
      if (target.hp <= 0) { target.dead = true; state.gold += 8; }
    }
  }

  state.enemies = state.enemies.filter(e => !e.dead);
  state.shots = state.shots.filter(s => (s.life -= dt) > 0);

  if (state.waveActive && !state.spawnQueue.length && !state.enemies.length) {
    state.waveActive = false;
    const w = WAVES[state.wave - 1];
    state.gold += w.reward;
    if (state.wave >= WAVES.length) { state.over = true; state.won = true; }
    else state.betweenTimer = 4;
  }
  if (!state.waveActive && state.betweenTimer > 0) {
    state.betweenTimer -= dt;
    if (state.betweenTimer <= 0 && !state.over) startWave();
  }
  if (state.lives <= 0) { state.lives = 0; state.over = true; state.won = false; }
}

// ---------- отрисовка ----------
function drawGround() {
  const T = 64;
  const n = RECTS.grass.length;
  for (let y = 0; y < H; y += T) {
    for (let x = 0; x < W; x += T) {
      const i = Math.abs(((x / T) | 0) * 3 + ((y / T) | 0) * 5) % n;
      const g = RECTS.grass[i];
      if (atlasReady) ctx.drawImage(atlas, g.x, g.y, g.w, g.h, x, y, T, T);
      else { ctx.fillStyle = "#6c8e4a"; ctx.fillRect(x, y, T, T); }
    }
  }
}

function drawRoad() {
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = "#7a6a45"; ctx.lineWidth = 44;
  ctx.beginPath(); ctx.moveTo(PATH[0].x, PATH[0].y);
  for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
  ctx.stroke();
  ctx.strokeStyle = "#8d7b52"; ctx.lineWidth = 36;
  ctx.beginPath(); ctx.moveTo(PATH[0].x, PATH[0].y);
  for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
  ctx.stroke();
  ctx.strokeStyle = "rgba(60,50,30,.30)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PATH[0].x, PATH[0].y);
  for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawGround();
  drawRoad();

  // замок в конце пути — то, что защищаем
  const end = PATH[PATH.length - 1];
  spr("base", 0, end.x - 66, end.y + 40, 86, false);

  // слоты
  for (const s of SLOTS) {
    const occupied = state.towers.some(t => t.sx === s.x && t.sy === s.y);
    if (occupied) continue;
    ctx.strokeStyle = "rgba(255,255,255,.42)"; ctx.setLineDash([4, 5]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y + 6, 20, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(TOWER_COST, s.x, s.y + 6);
  }

  // башни
  for (const t of state.towers) {
    ctx.fillStyle = "rgba(46,160,67,0.07)";
    ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(31,111,67,0.35)"; ctx.lineWidth = 1; ctx.stroke();

    spr(TOWER_SPR[t.level - 1], 0, t.x, t.y + 34, 76, false);

    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("L" + t.level, t.x, t.y + 44);
  }

  // выстрелы
  for (const s of state.shots) {
    const k = 1 - s.life / 0.14;
    const px = s.x1 + (s.x2 - s.x1) * (0.35 + 0.65 * k);
    const py = s.y1 + (s.y2 - s.y1) * (0.35 + 0.65 * k);
    ctx.save();
    ctx.globalAlpha = Math.min(1, s.life / 0.09);
    ctx.translate(px, py); ctx.rotate(s.a);
    if (atlasReady) {
      const r = RECTS.arrow;
      const h = 14, w = r.w * (h / r.h);
      ctx.drawImage(atlas, r.x, r.y, r.w, r.h, -w / 2, -h / 2, w, h);
    }
    ctx.restore();
  }

  // враги
  for (const e of state.enemies) {
    const p = posAt(e.d);
    const ahead = posAt(Math.min(e.d + 8, TOTAL));
    const flip = ahead.x < p.x - 0.5;
    const frame = Math.floor(e.anim * 9);
    spr(e.unit, frame, p.x, p.y + 20, 44, flip);

    const frac = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(p.x - 13, p.y - 26, 26, 5);
    ctx.fillStyle = frac > 0.5 ? "#3fb950" : frac > 0.25 ? "#e3b341" : "#f85149";
    ctx.fillRect(p.x - 12, p.y - 25, 24 * frac, 3);
  }

  // оверлей
  if (state.over) {
    ctx.fillStyle = "rgba(13,17,23,.84)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = state.won ? "#3fb950" : "#f85149";
    ctx.font = "bold 34px sans-serif";
    ctx.fillText(state.won ? "Полигон пройден" : "Прорыв", W / 2, H / 2 - 10);
    ctx.fillStyle = "#8b949e"; ctx.font = "14px sans-serif";
    ctx.fillText("Волн: " + state.wave + " · Жизней: " + state.lives, W / 2, H / 2 + 22);
  }
}

function syncHud() {
  document.getElementById("gold").textContent = state.gold;
  document.getElementById("lives").textContent = state.lives;
  document.getElementById("wave").textContent = state.wave;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt); draw(); syncHud();
  requestAnimationFrame(loop);
}
document.getElementById("play").addEventListener("click", () => {
  document.getElementById("center").classList.add("hidden");
  state.running = true;
  startWave();
});
requestAnimationFrame(loop);
</script>
</body>
</html>
